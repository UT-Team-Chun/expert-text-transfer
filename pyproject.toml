[project]
name = "expert-text-transfer"
version = "1.0.0"
description = "Companion code: expert free-text as a transferable covariate for out-of-region prediction (Nature Communications submission)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0,<2.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "torch>=2.0.0",
    "gpytorch>=1.11",
    "sentence-transformers>=3.0.0",
    "gpboost>=1.6.7",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyarrow>=15.0.0",
    # module-level import in scripts/train_kanto_smoke.py (config handling);
    # without it the training entry point fails at import
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Lazily imported, only by the paths named. Install if you run those.
#   baselines: national/evaluation/baselines.py boosted-tree rungs
#   cube:      the national-cube product read by scripts/predict_national_cube.py
#              and the cube figure panels of scripts/build_paper2_figs.py
baselines = ["lightgbm>=4.0.0", "xgboost>=2.0.0"]
cube = ["xarray>=2024.1.0", "zarr>=2.17.0", "rioxarray>=0.15.0", "netCDF4>=1.6.0"]

[tool.setuptools]
packages = { find = { include = ["national*", "scripts*"] } }
